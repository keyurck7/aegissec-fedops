policy:
  policy_id: AEGIS-ML-ADVISORY-GOVERNANCE-POLICY
  version: 1.0.0
  contract_id: AEGIS-ML-ADVISORY-INPUT-CONTRACT
  contract_version: 1.0.0
  description: Governance boundary for an independent machine-learning advisory. The model may consume
    approved pre-policy evidence features, but must not consume SSVC outputs, final dispositions, production-readiness
    fields, human-review decisions, or governance stage outcomes.
authority:
  ssvc_role: AUTHORITATIVE_POLICY_DECISION
  ml_role: INDEPENDENT_ADVISORY_ONLY
  ml_may_override_ssvc: false
  ml_may_authorize_final_disposition: false
  agreement_gate_required: true
source_contract:
  required_contract_id: AEGIS-DECISION-FEATURE-CONTRACT
  required_contract_version: 1.0.0
  required_upstream_stage_gate: PASS
  missing_values: PRESERVE_NULL_OR_UNKNOWN
model_features:
- feature_id: cvss_base_score
  source_path: $.features.technical_severity.base_score
  data_type: number
  required: true
  minimum: 0.0
  maximum: 10.0
- feature_id: cvss_exploitability_score
  source_path: $.features.technical_severity.exploitability_score
  data_type: number
  required: false
  nullable: true
  minimum: 0.0
  maximum: 10.0
- feature_id: cvss_impact_score
  source_path: $.features.technical_severity.impact_score
  data_type: number
  required: false
  nullable: true
  minimum: 0.0
  maximum: 10.0
- feature_id: cvss_base_severity
  source_path: $.features.technical_severity.base_severity
  data_type: string
  required: true
  allowed_values:

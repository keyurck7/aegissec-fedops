- field_id: subsector
  source_path: $.features.mission_and_sector_impact.subsector
- field_id: jurisdictions
  source_path: $.features.mission_and_sector_impact.jurisdictions
- field_id: synthetic_or_demo_context
  source_path: $.features.asset_criticality.synthetic_or_demo_context
prohibited_inputs:
  path_prefixes:
  - $.features.governance
  - $.release_decision
  - $.features.exploitation.ssvc_source_assertion
  - $.audit
  - $.inputs
  - $.provenance
  - $.quality_gates
  exact_paths:
  - $.features.affectedness.human_review_required
  - $.features.asset_criticality.approval_status
  - $.features.mission_and_sector_impact.sector_label_is_decision_input
  key_names:
  - ssvc_decision
  - official_ssvc_decision
  - matched_row
  - outcome
  - policy_decision
  - human_review_required
  - production_readiness
  - stage_gate
  - next_stage
  - final_disposition
  - final_priority
  - priority
  - action
  - response_deadline_hours
  - arbitration
  - final_decision
  - ml_prediction
  - ml_advisory
label_contract:
  label_name: advisory_urgency
  allowed_classes:
  - MONITOR
  - SCHEDULED
  - PRIORITY
  - IMMEDIATE
  accepted_independent_source_types:
  - INCIDENT_CONFIRMED_EXPLOITATION
  - VERIFIED_SECURITY_EVENT
  - REMEDIATION_OPERATION_OUTCOME
  - SAFETY_MISSION_IMPACT_REVIEW
  - EXPERT_PANEL_BLINDED_TO_SSVC
  prohibited_source_types:
  - SSVC_POLICY_DECISION
  - SSVC_OUTCOME
  - SSVC_VECTOR
  - POLICY_RULE_DERIVATION
  - MODEL_PREDICTION
  - FINAL_DISPOSITION
  - HUMAN_RELABELED_FROM_SSVC
  required_fields:
  - label
  - source_type
  - source_record_id
  - source_sha256
  - observed_at
  - observation_window_days
  - target
  - synthetic
  controlled_synthetic_source_type: CONTROLLED_SYNTHETIC_SCENARIO
  synthetic_permitted_for_development: true
  synthetic_production_eligible: false
release:
  production_readiness: BLOCKED
  development_stage_gate: PASS
  next_stage: MILESTONE_12F2_PROVENANCE_GOVERNED_DATASET
  remaining_blockers:
  - No production-grade independent outcome dataset has been approved.
  - No trained model, calibration evidence, XAI evidence, OOD detector, or agreement gate exists yet.
  - Synthetic labels may support development demonstrations only and cannot establish production validity.

policy:
  policy_id: AEGIS-AFFECTEDNESS-POLICY
  version: 1.0.0
  engine_version: 0.1.0
  description: >
    Policy governing package matching, evidence trust, version-range
    evaluation, uncertainty, abstention and human review for affectedness
    determinations.

identity:
  exact_purl_confidence: 1.00
  exact_ecosystem_name_confidence: 0.92
  definitive_threshold: 0.90
  probable_threshold: 0.70

trust:
  definitive_threshold: 0.85
  probable_threshold: 0.65

range_evaluation:
  supported_range_types:
    - ECOSYSTEM
    - SEMVER

  definitive_range_statuses:
    - available

  probable_range_statuses:
    - partial

  abstain_range_statuses:
    - conflicting
    - missing
    - unknown

state_rules:
  no_package_match: unknown
  missing_component_version: unknown
  malformed_component_version: unknown
  unsupported_range_type: unknown
  trust_reject: unknown
  trust_quarantine: unknown

human_review_required_for:
  - probably_affected
  - unknown
  - probably_not_affected

confidence_caps:
  affected: 0.99
  probably_affected: 0.79
  unknown: null
  probably_not_affected: 0.79
  not_affected: 0.95
  fixed: 0.97

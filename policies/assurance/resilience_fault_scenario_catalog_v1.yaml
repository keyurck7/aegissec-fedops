production_readiness:
  status: BLOCKED
  blocking_reasons:
  - Real operational validation has not yet been completed.
  - Independent security review has not yet been completed.
limitations:
- Faults are deterministically injected into isolated temporary directories and in-memory adapters.
- No production database, message broker, distributed filesystem, or live external dependency is disrupted.
- Operational chaos testing and independent security review remain mandatory before deployment.

policy:
  catalog_id: AEGIS-HOSTILE-INPUT-CATALOG
  version: 1.0.0
  harness_version: 1.0.0
  description: Controlled hostile and malformed input scenarios for AegisSec parser and validation boundaries.
trusted_inputs:
  strict_parsing_module:
    relative_path: src/normalization/strict_parsing.py
    expected_sha256: 9f442aeda323f9917db6b5a88e61acce49f5d3235a694a9ccd4862c510f6fdcc
  versioning_module:
    relative_path: src/affectedness/versioning.py
    expected_sha256: b11d7d492997001667cff5cbc8f27db1f046ffcfb12b0c0bccdf4c5a1365f033
  feature_parser_module:
    relative_path: src/ingestion/vulnerability_feature_parser.py
    expected_sha256: 9ad5b77214627aaaa73b05bf3a86c0ed8e2543d78af040c239db4b3ded9a5bd2
  intelligence_validator_module:
    relative_path: src/validation/vulnerability_intelligence_validator.py
    expected_sha256: 559be8fd5f2c68af468e051dc886ebbc1089f4ec3e31a101b9c1acb08974bbd0
  intelligence_schema:
    relative_path: schemas/aegis_vulnerability_intelligence.schema.json
    expected_sha256: b488403d7c8947e7e2b3fd40a49b48403606ea7d06bb40475eeb29be5aaac01d
  intelligence_fixture:
    relative_path: data/sample_inputs/intelligence/valid_log4shell_intelligence.json
    expected_sha256: e2204ab8ff8736c0826ffe24d518cef462a75dcea7e498943506b0fe7f41ff1f
  strict_parsing_fixture:
    relative_path: data/sample_inputs/parsing/strict_parsing_cases.csv
    expected_sha256: 127c929cb4f881d345155a6e3da273063b28ff36d42b07647f53d7dcecf388e7
  step11c_report:
    relative_path: data/validation_reports/tampering/step11c_tamper_assurance_report.json
    expected_sha256: 74f0849ee40aa73f09b9abf23929bbaf4a355d51f00c9b01958b01f943867a23
release_gates:
  critical_hostile_input_defence_rate_minimum: 1.0
  undetected_critical_inputs_maximum: 0
  harness_errors_maximum: 0
  nonfinite_rejection_rate_minimum: 1.0
  unicode_deception_detection_rate_minimum: 1.0
  oversized_payload_defence_rate_minimum: 1.0
  malformed_identifier_defence_rate_minimum: 1.0
  missing_value_semantic_accuracy_minimum: 1.0
  type_confusion_defence_rate_minimum: 1.0
  require_trusted_inputs_unchanged: true
  approved_remaining_production_blockers:
  - Real operational validation has not yet been completed.
  - Independent security review has not yet been completed.
scenarios:
- scenario_id: INPUT-BOOLEAN-FALSE-STRING-001
  title: False string remains false
  family: boolean_deception
  severity: critical
  handler: boolean_false_string
  control_tags:
  - boolean_semantics
  expected_outcomes:
  - NORMALIZED_SAFE
  expected_oracles:
  - STRICT_PARSER

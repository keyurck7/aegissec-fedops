production_readiness:
  status: BLOCKED
  blocking_reasons:
  - Real operational validation has not yet been completed.
  - Independent security review has not yet been completed.
  - Production CI signing identity, transparency-log verification, and reproducible-build infrastructure have not yet been independently validated.
limitations:
- Scenarios use controlled local files, deterministic Ed25519 fixture keys, and no production signing material.
- No live package registry, transparency log, CI platform, artifact registry, or model registry is modified.
- Independent operational verification of production builders, signing identities, and reproducible builds remains mandatory.
